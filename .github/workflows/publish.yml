name: publish

# A release created with GITHUB_TOKEN does not trigger release: published, so the
# monthly refresh tags, releases, builds, and publishes in this same file.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
on:
  schedule:
    # 06:23 UTC on the 1st, off the top of the hour.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    - cron: "23 6 1 * *"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.refresh.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Refresh OUI database
        id: refresh
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import certifi
          import requests
          from manuf2.manuf import MacParser

          path = Path("manuf2/manuf")
          original = path.read_bytes()

          def entry_count(data):
              return sum(
                  1
                  for line in data.decode("utf-8").splitlines()
                  if line.strip() and not line.startswith("#")
              )

          def write_output(**items):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  for key, value in items.items():
                      fh.write(f"{key}={value}\n")

          old = entry_count(original)
          response = requests.get(
              MacParser.MANUF_URL,
              headers={"User-Agent": "Mozilla"},
              verify=certifi.where(),
              timeout=120,
          )
          response.raise_for_status()
          new_bytes = response.content
          if new_bytes == original:
              write_output(publish="false")
              print("manuf2/manuf is unchanged; not releasing")
              raise SystemExit(0)

          path.write_bytes(new_bytes)
          new = entry_count(new_bytes)
          try:
              MacParser(manuf_name=str(path))
          except Exception as exc:
              path.write_bytes(original)
              raise SystemExit(f"refreshed manuf failed to parse: {exc}") from exc
          if new * 10 < old * 9:
              path.write_bytes(original)
              raise SystemExit(f"entry count collapsed from {old} to {new}")

          write_output(publish="true", old=old, new=new)
          print(f"manuf changed: {old} -> {new} entries")
          PY
      - name: Test refreshed database
        if: steps.refresh.outputs.publish == 'true'
        run: |
          cp manuf2/test/manuf /tmp/manuf-fixture
          cp manuf2/manuf manuf2/test/manuf
          trap 'cp /tmp/manuf-fixture manuf2/test/manuf' EXIT
          python -m pytest
      - name: Tag and publish GitHub release
        id: release
        if: steps.refresh.outputs.publish == 'true'
        env:
          OLD: ${{ steps.refresh.outputs.old }}
          NEW: ${{ steps.refresh.outputs.new }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: jsz
          GIT_AUTHOR_EMAIL: josh@joshschmelzle.com
          GIT_COMMITTER_NAME: jsz
          GIT_COMMITTER_EMAIL: josh@joshschmelzle.com
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          path = Path("setup.py")
          text = path.read_text(encoding="utf-8")
          match = re.search(r'version="(\d+)\.(\d+)\.(\d+)"', text)
          if not match:
              raise SystemExit("version not found in setup.py")
          major, minor, patch = match.groups()
          version = f"{major}.{minor}.{int(patch) + 1}"
          path.write_text(
              text.replace(match.group(0), f'version="{version}"', 1),
              encoding="utf-8",
          )
          print(version, end="")
          PY
          )
          git add -- manuf2/manuf setup.py
          git commit -m "v${VERSION}: update OUI db"
          git tag "v${VERSION}"
          git push --atomic origin HEAD:master "refs/tags/v${VERSION}"
          gh release create "v${VERSION}" --notes "OUI database refresh (${OLD} -> ${NEW} entries)"
          {
            echo "tag=v${VERSION}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: refresh
    if: always() && !cancelled() && github.event_name == 'release'
    uses: ./.github/workflows/test.yml

  build:
    needs: [refresh, test]
    if: always() && !cancelled() && ((github.event_name == 'release' && needs.test.result == 'success') || (needs.refresh.result == 'success' && needs.refresh.outputs.publish == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.refresh.outputs.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ needs.refresh.outputs.tag || github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import re; print(re.search(r'version=\"([^\"]+)\"', open('setup.py').read()).group(1), end='')")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag $TAG does not match setup.py version $(printf '%q' "$VERSION")"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Trusted publisher on PyPI is registered for this workflow file.
  # https://docs.pypi.org/trusted-publishers/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/manuf2/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
